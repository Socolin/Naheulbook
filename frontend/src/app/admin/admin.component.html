<mat-sidenav-container>
  <mat-sidenav #start>
    <h2 class="mat-h2">Administration</h2>
    <mat-nav-list>
      <a mat-list-item [routerLink]="['/admin/users']">
        <mat-icon matListItemIcon>manage_accounts</mat-icon>
        Utilisateurs
      </a>
    </mat-nav-list>
    <common-nav></common-nav>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <mat-toolbar-row>
        <button mat-icon-button (click)="start.open()" aria-label="Afficher le menu">
          <mat-icon>menu</mat-icon>
        </button>
        <div class="app-toolbar">
          <h1>
            Naheulbook - Administration
          </h1>
          <a class="home-link" aria-label="Page d'accueil" [routerLink]="['/']"><mat-icon>home</mat-icon></a>
        </div>
      </mat-toolbar-row>
    </mat-toolbar>

    <div class="app-content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

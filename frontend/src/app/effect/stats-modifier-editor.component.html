<mat-form-field><mat-label>Nom</mat-label><input matInput [(ngModel)]="modifier.name" required>
</mat-form-field>
@if (!options?.noType) {
  <mat-form-field>
    <mat-label>Type</mat-label>
    <input matInput [(ngModel)]="modifier.type">
  </mat-form-field>
}
@if (!options?.noDescription) {
  <mat-form-field>
    <mat-label>Description</mat-label>
    <textarea matInput
      [(ngModel)]="modifier.description"
      cdkTextareaAutosize
      cdkAutosizeMinRows="1"
      cdkAutosizeMaxRows="5">
    </textarea>
  </mat-form-field>
}
<duration-selector [durable]="modifier"></duration-selector>
@if (reusableToggle) {
  <mat-checkbox color="primary" [(ngModel)]="modifier.reusable">
    Ré-utilisable
  </mat-checkbox>
}
<mat-card-content>
  <modifiers-editor [modifiers]="modifier.values"></modifiers-editor>
</mat-card-content>

<div class="header">
  <h1 class="mat-h1">
    Cartes
  </h1>
  <button (click)="addMap()" mat-stroked-button color="primary">
    <mat-icon>add</mat-icon>
    Ajouter une carte
  </button>
</div>

<mat-form-field>
  <mat-label>&#x2063;Filtre</mat-label>
  <input matInput [formControl]="filterControl" autocomplete="off"  autocapitalize="off"/>
</mat-form-field>

<mat-nav-list>
  @for (map of maps; track map) {
    <div>
      <a  mat-list-item [routerLink]="['/map', map.id]">{{map.name}}</a>
    </div>
  }
</mat-nav-list>

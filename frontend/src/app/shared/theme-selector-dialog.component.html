<h2 mat-dialog-title>Choix du thème</h2>
<mat-dialog-content>
  <div class="themes" role="radiogroup" aria-label="Thème">
    @for (theme of themes; track theme.id) {
      <button class="theme-option"
              type="button"
              role="radio"
              matRipple
              [attr.aria-checked]="theme.id === currentTheme"
              [class.selected]="theme.id === currentTheme"
              (click)="changeTheme(theme)">
        <!-- The theme class scopes the theme's color tokens to the preview -->
        <div class="preview {{ theme.id }}" aria-hidden="true">
          <div class="preview-toolbar">
            <span class="preview-line short"></span>
          </div>
          <div class="preview-body">
            <div class="preview-card">
              <span class="preview-line"></span>
              <span class="preview-line medium"></span>
            </div>
            <div class="preview-actions">
              <span class="preview-chip"></span>
              <span class="preview-button"></span>
            </div>
          </div>
        </div>
        <div class="label">
          @if (theme.id === currentTheme) {
            <mat-icon>check_circle</mat-icon>
          }
          {{ theme.label }}
        </div>
      </button>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button matDialogClose>Fermer</button>
</mat-dialog-actions>

<h2 mat-dialog-title>Générer un nom</h2>
<mat-dialog-content [formGroup]="form">
  <mat-form-field>
    <mat-label>Origine</mat-label>
    <mat-select formControlName="originId">
      @for (origin of origins; track origin) {
        <mat-option [value]="origin.id">
          {{origin.name}}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>
  <mat-radio-group formControlName="sex" class="sex-selector">
    <mat-radio-button name="sexe" [value]="'Homme'">
      <mat-icon fontSet="game-icon" fontIcon="game-icon-male" class="ra-mat-button-icon-24"></mat-icon>
      Homme
    </mat-radio-button>
    <mat-radio-button name="sexe" [value]="'Femme'">
      <mat-icon fontSet="game-icon" fontIcon="game-icon-female" class="ra-mat-button-icon-24"></mat-icon>
      Femme
    </mat-radio-button>
  </mat-radio-group>
  <mat-form-field>
    <mat-label>Nom</mat-label>
    <input matInput formControlName="name"/>
    <button matSuffix mat-button type="button" (click)="randomName()">
      <mat-icon fontSet="ra" fontIcon="ra-perspective-dice-random"></mat-icon>
      Générer
    </button>
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close color="primary">
    FERMER
  </button>
  <button mat-button color="primary" (click)="valid()">
    VALIDER
  </button>
</mat-dialog-actions>

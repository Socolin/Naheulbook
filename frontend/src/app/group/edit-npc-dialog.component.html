<mat-toolbar color="primary">
  <button mat-icon-button mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
  @if (data.npc) {
    <span>Edition d'un PNJ</span>
  }
  @if (!data.npc) {
    <span>Création d'un PNJ</span>
  }
  <button mat-button (click)="valid()" [disabled]="!form.valid">
    @if (data.npc) {
      EDITER
    }
    @if (!data.npc) {
      AJOUTER
    }
  </button>
</mat-toolbar>
<div class="content mat-typography" [formGroup]="form">
  <mat-form-field class="name">
    <mat-label>Nom</mat-label>
    <input matInput formControlName="name" required/>
    <button matSuffix mat-button type="button" (click)="openRandomNameGeneratorDialog()">
      <mat-icon fontSet="ra" fontIcon="ra-perspective-dice-random"></mat-icon>
      Générer
    </button>
  </mat-form-field>
  <ng-container formGroupName="data">
    <div class="location-origin">
      <mat-form-field>
        <mat-label>Lieu</mat-label>
        <input matInput formControlName="location"/>
      </mat-form-field>
      <mat-form-field>
        <mat-label>Origine</mat-label>
        <input matInput formControlName="originName"/>
      </mat-form-field>
    </div>
    <mat-radio-group formControlName="sex" class="sex-selector">
      <mat-radio-button name="sexe" [value]="undefined">
        Non-défini
      </mat-radio-button>
      <mat-radio-button name="sexe" [value]="'Homme'">
        <span class="sex-label">
          <mat-icon fontSet="game-icon" fontIcon="game-icon-male"></mat-icon>
          Homme
        </span>
      </mat-radio-button>
      <mat-radio-button name="sexe" [value]="'Femme'">
        <span class="sex-label">
          <mat-icon fontSet="game-icon" fontIcon="game-icon-female"></mat-icon>
          Femme
        </span>
      </mat-radio-button>
    </mat-radio-group>
    <mat-form-field class="note">
      <mat-label>Note</mat-label>
      <textarea matInput formControlName="note" cdkTextareaAutosize cdkAutosizeMinRows="1"></textarea>
    </mat-form-field>
  </ng-container>
</div>

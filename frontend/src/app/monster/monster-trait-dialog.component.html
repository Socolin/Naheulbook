<h2 mat-dialog-title>{{data.trait.name}}</h2>
<mat-dialog-content>
  <div class="description">
    {{data.trait.description}}
  </div>
  @if (levels.length) {
    <div class="levels">
      @for (level of levels; track level.level) {
        <div class="level">
          <span class="level-number">Niveau {{level.level}}</span>
          <span class="level-description">{{level.description}}</span>
        </div>
      }
    </div>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close
    color="primary">
    FERMER
  </button>
</mat-dialog-actions>

<h2 mat-dialog-title>Traits du monstre</h2>
<mat-dialog-content>
  @if (!traits) {
    <mat-spinner class="spinner" diameter="48"></mat-spinner>
  } @else {
    <div class="section-title">Traits</div>
    <div class="trait-list">
      @for (trait of simpleTraits; track trait.id) {
        <div class="trait-row clickable"
             [class.active]="selectedSimpleTraits[trait.id]"
             (click)="selectedSimpleTraits[trait.id] = !selectedSimpleTraits[trait.id]">
          <mat-checkbox [checked]="selectedSimpleTraits[trait.id]"
                        (click)="$event.stopPropagation()"
                        (change)="selectedSimpleTraits[trait.id] = $event.checked">
          </mat-checkbox>
          <span class="trait-name">{{trait.name}}</span>
          <button mat-icon-button class="info-button" (click)="showTraitInfo($event, trait)" aria-label="Description du trait">
            <mat-icon>info_outline</mat-icon>
          </button>
        </div>
      }
    </div>

    <div class="section-title">Traits à niveaux</div>
    <div class="trait-list">
      @for (trait of powerTraits; track trait.id) {
        <div class="trait-row" [class.active]="selectedPowerTraits[trait.id]">
          <span class="trait-name">{{trait.name}}</span>
          <button mat-icon-button class="info-button" (click)="showTraitInfo($event, trait)" aria-label="Description du trait">
            <mat-icon>info_outline</mat-icon>
          </button>
          <mat-button-toggle-group class="level-toggle"
                                   hideSingleSelectionIndicator
                                   [ngModel]="selectedPowerTraits[trait.id] ?? 0"
                                   (ngModelChange)="selectedPowerTraits[trait.id] = $event">
            @for (level of levels; track level) {
              <mat-button-toggle [value]="level">{{level}}</mat-button-toggle>
            }
          </mat-button-toggle-group>
        </div>
      }
    </div>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>ANNULER</button>
  <button mat-flat-button color="primary" (click)="save()">SAUVEGARDER</button>
</mat-dialog-actions>
